name: v0.2.64 Device Correction CI

on:
  push:
    branches:
      - native-only-bow-trident-renderer
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact v0.2.63 baseline
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v0263-parts.sha256 <<'EOF'
          510adeb7418f3f2fbdf04328b26a2b6519c7dce3d46b40bac7edce09eed41093  .ci-payload/native-only-v0263.part1
          6597008502098b16c46b75517524f3546c003ba5ac0f8fb26e73541e92bbb574  .ci-payload/native-only-v0263.part2
          7f9d659076fe10661101b199668710a9e5b12edd00e7caad8e239366bb56c2e7  .ci-payload/native-only-v0263.part3a
          6ad7d0501b4949d1c504c95034e05adb8c59f52e443c4b7e1112efc1b3f4543c  .ci-payload/native-only-v0263.part3b
          EOF
          sha256sum -c /tmp/v0263-parts.sha256
          cat .ci-payload/native-only-v0263.part1 \
              .ci-payload/native-only-v0263.part2 \
              .ci-payload/native-only-v0263.part3a \
              .ci-payload/native-only-v0263.part3b \
            | base64 -d > /tmp/native-only-v0263.tar.gz
          echo 'fa7d288030c7f51c78cf4a54bb305955002da222ab03ed32a2e38100619f6ad6  /tmp/native-only-v0263.tar.gz' | sha256sum -c -
          tar -xzf /tmp/native-only-v0263.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f src/runtime/OffhandBlockRenderPatch.cpp

      - name: Apply v0.2.64 device-correction overlay
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v0264-parts.sha256 <<'EOF'
          a815345f922a8748b5a1e5c1a693ac7275a961210a1494a4c94d53831194a745  .ci-payload/v0264-small.part1
          5d94d929456acc342398c415d65b850b746a589463bd0a7efc7ef0bdf2b2b086  .ci-payload/v0264-small.part2
          7616f359cedc4ef09f1f42395a5902f746f6d8d5b45dd5c509d09739d577037f  .ci-payload/v0264-small.part3
          c4e23ad67e4e6f5230195d308a616325b85e636f1e28826e41a882cbc1b629c0  .ci-payload/v0264-small.part4
          b3f6969ab4ca1489bb0eec5a827ea63f17139f562da6f6493d4b910005a8925f  .ci-payload/v0264-small.part5
          7c4ef667007ed069981b153590bcbd3320d038bc044d9520f1f16aecbd8ce3ee  .ci-payload/v0264-small.part6
          bf455ff9619121545f244c92df92bf31af99fb7b2f437926a335122088ba2f5a  .ci-payload/v0264-small.part7
          18f34931ecd5aed4daa8e491a7914ab6ae90968762d76b1e58e04fe3b9e077a1  .ci-payload/v0264-small.part8
          EOF
          sha256sum -c /tmp/v0264-parts.sha256
          cat .ci-payload/v0264-small.part1 \
              .ci-payload/v0264-small.part2 \
              .ci-payload/v0264-small.part3 \
              .ci-payload/v0264-small.part4 \
              .ci-payload/v0264-small.part5 \
              .ci-payload/v0264-small.part6 \
              .ci-payload/v0264-small.part7 \
              .ci-payload/v0264-small.part8 \
            | base64 -d > /tmp/v0264-overlay.tar.gz
          echo '5fdb08370a7ee4b1b52db7948947d168f93d6959c8313edeab7f0efec1064da8  /tmp/v0264-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v0264-overlay.tar.gz -C "$GITHUB_WORKSPACE"
          if [[ -f .delete-list ]]; then
            while IFS= read -r path; do
              [[ -z "$path" ]] || rm -f "$path"
            done < .delete-list
            rm -f .delete-list
          fi
          grep -q '"version": "0.2.64"' manifest.json
          tar --exclude=.git --exclude=.ci-payload --exclude=build --exclude=dist \
            -czf /tmp/levi-offhand-v0.2.64-source.tar.gz .

      - name: Upload reconstructed v0.2.64 source
        uses: actions/upload-artifact@v4
        with:
          name: levi-offhand-v0.2.64-source
          path: /tmp/levi-offhand-v0.2.64-source.tar.gz

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and tools
        run: |
          sdkmanager "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build zip

      - name: Run tests
        run: bash tests/run_native_attachment_fix_tests.sh

      - name: Build
        env:
          LEVI_NDK_VERSION: "28.2.13676358"
        run: bash ./scripts/build.sh

      - name: Inspect output
        run: |
          unzip -t dist/arm64-v8a/levi-offhand-v0.2.64.levipack
          unzip -l dist/arm64-v8a/levi-offhand-v0.2.64.levipack
          file build/android-arm64-v8a-Release/out/arm64-v8a/liblevi_offhand.so

      - name: Upload levipack
        uses: actions/upload-artifact@v4
        with:
          name: levi-offhand-v0.2.64-device-correction
          path: dist/arm64-v8a/levi-offhand-v0.2.64.levipack
