name: Build Levi Offhand

on:
  push:
    branches:
      - main
      - "test/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize v0.2.65 source
        run: |
          cat \
            .github/v0265-source.tar.gz.b64.part00 \
            .github/v0265-source.tar.gz.b64.part01 \
            .github/v0265-source.tar.gz.b64.part02 \
            .github/v0265-source.tar.gz.b64.part03 \
            .github/v0265-source.tar.gz.b64.part04 \
            > /tmp/v0265-source.b64
          echo "8d603b059375644504eaf3afea9569e61ea53fe7b309ffafc3e068090812f78b  /tmp/v0265-source.b64" | sha256sum --check --strict
          base64 --decode /tmp/v0265-source.b64 > /tmp/v0265-source.tar.gz
          echo "fa45135e0bd2ef23c344b73d21c099c2eb25dec33b48cb1e6df51dee8ffb9443  /tmp/v0265-source.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/v0265-source.tar.gz
          rm -f src/runtime/OffhandBlockRenderPatch.cpp

      - name: Apply v0.2.66 native3D frame overlay
        run: |
          cat \
            .github/v0266-overlay.chunk00 \
            .github/v0266-overlay.chunk01 \
            .github/v0266-overlay.chunk02 \
            .github/v0266-overlay.chunk03 \
            .github/v0266-overlay.chunk04 \
            .github/v0266-overlay.chunk05 \
            .github/v0266-overlay.chunk06 \
            .github/v0266-overlay.chunk07 \
            .github/v0266-overlay.chunk08 \
            .github/v0266-overlay.chunk09 \
            .github/v0266-overlay.chunk10 \
            .github/v0266-overlay.chunk11 \
            > /tmp/v0266-overlay.patch.gz.b64
          echo "ebb666943e16439fb8a8c23633e7400c6389b2fe20bf61e95d6cdfb82700097f  /tmp/v0266-overlay.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/v0266-overlay.patch.gz.b64 > /tmp/v0266-overlay.patch.gz
          echo "375621adb4025a6dd26efb45e9499a7a4d07913a002ee494a6f859f17c320b74  /tmp/v0266-overlay.patch.gz" | sha256sum --check --strict
          gzip -dc /tmp/v0266-overlay.patch.gz > /tmp/v0266-overlay.patch
          echo "413b4c44dc582875b5e525bf34356197534e1c3c23ff866e57f782fe647c6ad1  /tmp/v0266-overlay.patch" | sha256sum --check --strict
          patch -p1 < /tmp/v0266-overlay.patch

      - name: Apply v0.2.67 reference-carrier overlay
        run: |
          cat \
            .github/v0267-overlay.chunk00 \
            .github/v0267-overlay.chunk01 \
            .github/v0267-overlay.chunk02 \
            > /tmp/v0267-overlay.patch.gz.b64
          echo "6a712ba31a2122a02d1d817c8181beef90fe350bc7ce9a3d9cb414163df93fa9  /tmp/v0267-overlay.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/v0267-overlay.patch.gz.b64 > /tmp/v0267-overlay.patch.gz
          echo "6f4f07dac84f505e259e5f2fe84424947e42cc0e19c64b57b07b9fa73a070079  /tmp/v0267-overlay.patch.gz" | sha256sum --check --strict
          gzip -dc /tmp/v0267-overlay.patch.gz > /tmp/v0267-overlay.patch
          echo "e1e5ad83d667ec0e4576dbaf35e8f3a24b51548cca4dc4da0d365f56c0ae81b9  /tmp/v0267-overlay.patch" | sha256sum --check --strict
          patch -p1 < /tmp/v0267-overlay.patch
          test "$(git hash-object src/render/OffhandBlockRenderPatch.cpp)" = "3a3ea8cde3a0ae3df2376fff3c1bd0a9aa3c43be"
          test "$(git hash-object src/render/NativeAttachmentFix.hpp)" = "deb12b1f33aa36e91d143d996ea92c415604f128"

      - name: Restore v0.2.68 action subsystem from main
        run: |
          git checkout HEAD -- \
            CMakeLists.txt \
            manifest.json \
            scripts/build.sh \
            src/LeviOffhandMod.cpp \
            src/ui/SwapButton.hpp \
            src/ui/SwapButton.cpp \
            src/runtime/OffhandSwapRuntime.hpp \
            src/runtime/OffhandSwapRuntime.cpp \
            src/runtime/HandActionPolicy.hpp \
            src/runtime/HandActionRouterCore.hpp \
            src/runtime/ActionHandContext.hpp \
            src/runtime/ActionHandContext.cpp \
            src/runtime/NativeCapabilityProbe.hpp \
            src/runtime/NativeCapabilityProbe.cpp \
            src/runtime/NativeOffhandPolicy.hpp \
            src/runtime/NativeOffhandPolicy.cpp \
            src/runtime/AutoInsertRouting.hpp \
            src/runtime/AutoInsertRouting.cpp \
            src/runtime/AutoInsertRoutingCore.hpp \
            src/runtime/HandActionRouter.hpp \
            src/runtime/HandActionRouter.cpp \
            src/runtime/NativeSemanticBridge.hpp \
            src/runtime/NativeSemanticBridge.cpp \
            src/runtime/RightUseRouter.hpp \
            src/runtime/RightUseRouter.cpp \
            tests/v0262_native_routing_source_contract.py \
            tests/v0262_auto_insert_routing_test.cpp \
            tests/v0268_swap_button_source_contract.py \
            tests/v0268_action_routing_source_contract.py \
            tests/v0268_action_routing_binary_contract.py \
            tests/v0268_hand_action_policy_test.cpp \
            tests/v0268_action_hand_context_test.cpp \
            tests/v0268_hand_action_router_core_test.cpp \
            tests/v0268_semantic_bridge_source_contract.py \
            tests/v0268_semantic_bridge_binary_contract.py \
            tests/v0268_render_126511_compat_source_contract.py
          grep -q '"version": "0.2.68"' manifest.json
          grep -q 'SwapButton.cpp' CMakeLists.txt
          grep -q 'OffhandSwapRuntime.cpp' CMakeLists.txt
          grep -q 'ButtonBuilder(kButtonId, "Swap Item")' src/ui/SwapButton.cpp
          grep -q 'kSetItemInHandSlotRva = 0xF579C50' src/runtime/OffhandSwapRuntime.cpp
          grep -q 'NativeCapabilityProbe.cpp' CMakeLists.txt
          grep -q 'NativeOffhandPolicy.cpp' CMakeLists.txt
          grep -q 'kPlannerRva126511 = 0xF9292A0' src/runtime/AutoInsertRouting.cpp
          grep -q 'destinationName(' src/runtime/AutoInsertRoutingCore.hpp
          grep -q 'HandActionRouter.cpp' CMakeLists.txt
          grep -q 'NativeSemanticBridge.cpp' CMakeLists.txt
          grep -q 'RightUseRouter.cpp' CMakeLists.txt

      - name: Run v0.2.68 action routing tests
        run: |
          python3 tests/v0262_native_routing_source_contract.py
          python3 tests/v0268_swap_button_source_contract.py
          python3 tests/v0268_action_routing_source_contract.py
          python3 tests/v0268_semantic_bridge_source_contract.py
          python3 tests/v0268_render_126511_compat_source_contract.py

          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc tests/v0262_auto_insert_routing_test.cpp \
            -o /tmp/v0262-auto-insert
          ASAN_OPTIONS=detect_leaks=0 /tmp/v0262-auto-insert

          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc tests/v0268_hand_action_policy_test.cpp \
            -o /tmp/v0268-policy
          ASAN_OPTIONS=detect_leaks=0 /tmp/v0268-policy

          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc tests/v0268_action_hand_context_test.cpp \
            src/runtime/ActionHandContext.cpp \
            -o /tmp/v0268-context
          ASAN_OPTIONS=detect_leaks=0 /tmp/v0268-context

          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc tests/v0268_hand_action_router_core_test.cpp \
            src/runtime/ActionHandContext.cpp \
            -o /tmp/v0268-router-core
          ASAN_OPTIONS=detect_leaks=0 /tmp/v0268-router-core

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and tools
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-28" \
            "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build zip

      - name: Build v0.2.68
        env:
          LEVI_NDK_VERSION: "28.2.13676358"
        run: bash ./scripts/build.sh

      - name: Inspect output
        run: |
          unzip -t dist/arm64-v8a/levi-offhand-v0.2.68.levipack
          unzip -l dist/arm64-v8a/levi-offhand-v0.2.68.levipack
          file build/android-arm64-v8a-Release/out/arm64-v8a/liblevi_offhand.so
          python3 - <<'PY2'
          import json, zipfile
          path='dist/arm64-v8a/levi-offhand-v0.2.68.levipack'
          with zipfile.ZipFile(path) as z:
              assert set(z.namelist()) == {'manifest.json','liblevi_offhand.so'}
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['version']=='0.2.68'
          PY2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: levi-offhand-arm64-v0.2.68
          path: dist/arm64-v8a/levi-offhand-v0.2.68.levipack

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/arm64-v8a/levi-offhand-v0.2.68.levipack
