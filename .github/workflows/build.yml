name: Build Levi Offhand

on:

  push:

    branches:
      - main

    tags:
      - "v*"


  pull_request:


  workflow_dispatch:


jobs:

  build-arm64:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install NDK and tools
        run: |

          sdkmanager \
            "platforms;android-28" \
            "ndk;28.2.13676358"

          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            zip


      - name: Build
        env:

          LEVI_NDK_VERSION: "28.2.13676358"

        run: |

          bash ./scripts/build.sh


      - name: Inspect output
        run: |

          unzip -l \
            dist/arm64-v8a/levi-offhand-v0.2.49.levipack

          file \
            build/android-arm64-v8a-Release/out/arm64-v8a/liblevi_offhand.so


      - name: Upload artifact
        uses: actions/upload-artifact@v4

        with:

          name: levi-offhand-arm64-v0.2.49

          path: >-
            dist/arm64-v8a/levi-offhand-v0.2.49.levipack


      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:

          files: >-
            dist/arm64-v8a/levi-offhand-v0.2.49.levipack
